name: Pre-Merge Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate repository contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep
      - name: Run pre-merge contract
        env:
          HARNESS_EVALUATION_REPORT: harness-evaluation.json
        run: scripts/validate-premerge.sh
      - name: Upload behavior scorecard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-evaluation-report
          path: harness-evaluation.json
          if-no-files-found: warn

  windows-installer:
    name: Validate Windows installer contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Harness
        run: cargo build -p harness --locked
      - name: Run PowerShell installer modes
        shell: pwsh
        run: tests/installer/test-install-harness-modes.ps1
